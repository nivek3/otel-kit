[package]
name = "axum-otel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "OpenTelemetry tracing for axum based on tower-http."
documentation = "https://docs.rs/axum-otel"
homepage = "https://github.com/nivek3/otel-kit/tree/main/crates/axum-otel"
repository = "https://github.com/nivek3/otel-kit/tree/main/crates/axum-otel"
readme = "README.md"
keywords = ["axum", "tracing", "opentelemetry", "logging"]

[dependencies]
axum = { workspace = true }
opentelemetry = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-otel = { workspace = true, features = ["macros", "span"] }

[dev-dependencies]
http-body-util = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
tower = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"] }
