[package]
name = "otel-http"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
description = "HTTP server spans and context propagation for OpenTelemetry."
documentation = "https://docs.rs/otel-http"
homepage = "https://github.com/nivek3/otel-kit/tree/main/crates/otel-http"
repository = "https://github.com/nivek3/otel-kit/tree/main/crates/otel-http"
readme = "README.md"
keywords = ["tracing", "opentelemetry", "http"]

[features]
default = []
fields = ["dep:http"]
macros = ["dep:tracing"]
http = ["fields", "dep:http", "dep:opentelemetry", "dep:opentelemetry-http"]
context = ["http", "dep:tracing", "dep:tracing-opentelemetry"]
span = ["context", "macros"]

[dependencies]
http = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
