[workspace]
members = [
    "crates/axum-otel",
    "crates/otel-init",
    "crates/tracing-otel",
    "examples/microservices/articles",
    "examples/microservices/users",
    "examples/otel",
]
resolver = "2"

[workspace.package]
rust-version = "1.96.0"
version = "0.33.2"
authors = ["nivek <h49987180@gmail.com>"]
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/nivek-ph/otel-kit"
documentation = "https://docs.rs/tracing-otel/"
readme = "README.md"
description = "Tracing and OpenTelemetry integration utility library for Rust applications."
keywords = [
    "axum",
    "tracing",
    "logging",
    "opentelemetry",
    "otel",
    "jaeger",
    "loki",
    "tempo",
]
categories = ["asynchronous"]

[workspace.dependencies]
# workspace crates
axum-otel = { path = "crates/axum-otel", version = "0.33.2" }
otel-init = { path = "crates/otel-init", version = "0.33.2" }
tracing-otel = { path = "crates/tracing-otel", version = "0.33.2" }

# external crates
anyhow = "1.0"

axum = { version = "0.8.7" }
config = { version = "0.15.0", default-features = false }
dotenvy = { version = "0.15.7" }
http = { version = "1.3.1" }
http-body-util = { version = "0.1" }
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = { version = "0.33" }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", features = [
    "grpc-tonic",
    "http-json",
    "http-proto",
    "tls-ring",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "trace",
    "logs",
] }

# reqwest (used in examples)
reqwest = { version = "0.13.1", features = ["json"] }
reqwest-middleware = { git = "https://github.com/TrueLayer/reqwest-middleware", rev = "75197ef573cc5f9aec9b0c934e3114950c5cf1e4" }
reqwest-retry = { git = "https://github.com/TrueLayer/reqwest-middleware", rev = "75197ef573cc5f9aec9b0c934e3114950c5cf1e4" }
reqwest-tracing = { git = "https://github.com/TrueLayer/reqwest-middleware", rev = "75197ef573cc5f9aec9b0c934e3114950c5cf1e4", features = ["opentelemetry_0_33"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Test dependencies
serial_test = { version = "3.3.1" }
tokio = { version = "1.45.1", features = ["full"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6.6", features = ["trace"] }

tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.4" }
tracing-opentelemetry = { version = "0.34" }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
